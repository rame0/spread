<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <symbol id="card" viewBox="0 0 44 74" width="44" height="74">
      <rect width="44" height="74" rx="6" fill="currentColor"/>
      <rect width="44" height="74" rx="6" fill="url(#sheen)"/>
      <!-- рамка карты таро -->
      <rect x="3" y="3" width="38" height="68" rx="4" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.2"/>
      <!-- чип -->
      <rect x="9" y="13" width="13" height="10" rx="2.2" fill="#f4d58d"/>
      <path d="M9 18h13M15.5 13v10M12 15.5h7v5h-7z" fill="none" stroke="#b8913a" stroke-width=".8"/>
      <!-- бесконтактная оплата -->
      <path d="M28 14.5a6 6 0 0 1 0 7M31.5 12.5a9 9 0 0 1 0 11M35 10.5a12 12 0 0 1 0 15" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.4" stroke-linecap="round"/>
      <!-- табличка с названием, как у таро, с номером карты -->
      <rect x="6" y="56" width="32" height="10" rx="2" fill="#000" fill-opacity=".22"/>
      <g fill="#fff" fill-opacity=".9">
        <circle cx="11" cy="61" r="1.2"/><circle cx="14.5" cy="61" r="1.2"/><circle cx="18" cy="61" r="1.2"/>
        <rect x="23" y="59.6" width="11" height="2.8" rx="1.4"/>
      </g>
    </symbol>
