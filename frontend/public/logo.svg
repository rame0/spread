  <g transform="rotate(-22 60 112)"><use href="#card" x="38" y="20" style="color:#1fa36d"/></g>
  <g transform="rotate(22 60 112)"><use href="#card" x="38" y="20" style="color:#e0962a"/></g>
  <use href="#card" x="38" y="16" style="color:#3d6cf0"/>
