services:
  postgres:
    image: postgres:16-alpine
    container_name: credit_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: credit_grace
    ports:
      - "5432:5432"
    volumes:
      - credit_postgres_data:/var/lib/postgresql/data
    networks:
      - traefik_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: credit_backend
    labels:
      - "traefik.enable=true"
      # Route API requests to backend
      - traefik.http.routers.credit_backend.rule=Host(`credit.local`) && PathPrefix(`/api`)
      - traefik.http.routers.credit_backend.entrypoints=web
      - traefik.docker.network=traefik_net
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/credit_grace
    networks:
      - traefik_net
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: credit_frontend
    labels:
      - "traefik.enable=true"
      # Route all other requests to frontend (catch-all)
      - traefik.http.routers.credit_frontend.rule=Host(`credit.local`)
      - traefik.http.routers.credit_frontend.entrypoints=web
      - traefik.docker.network=traefik_net
      # Lower priority so backend takes precedence for /api routes
      - traefik.http.routers.credit_frontend.priority=1
    environment:
      - NODE_ENV=production
    networks:
      - traefik_net
    depends_on:
      - backend

volumes:
  credit_postgres_data:

networks:
  traefik_net:
    external: true
