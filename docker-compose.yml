services:
  backend:
    build: ./backend
    container_name: credit_backend
    labels:
      - "traefik.enable=true"
      # Route API requests to backend
      - traefik.http.routers.credit_backend.rule=Host(`credit.local`) && PathPrefix(`/api`)
      - traefik.http.routers.credit_backend.entrypoints=web
      - traefik.docker.network=traefik_traefik
      # Optional: Strip /api prefix when forwarding to backend
      - traefik.http.middlewares.credit_backend_stripprefix.stripprefix.prefixes=/api
      - traefik.http.routers.credit_backend.middlewares=credit_backend_stripprefix
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - traefik_traefik

  frontend:
    build: ./frontend
    container_name: credit_frontend
    labels:
      - "traefik.enable=true"
      # Route all other requests to frontend (catch-all)
      - traefik.http.routers.credit_frontend.rule=Host(`credit.local`)
      - traefik.http.routers.credit_frontend.entrypoints=web
      - traefik.docker.network=traefik_traefik
      # Lower priority so backend takes precedence for /api routes
      - traefik.http.routers.credit_frontend.priority=1
    environment:
      - NODE_ENV=production
    networks:
      - traefik_traefik
    depends_on:
      - backend

networks:
  traefik_traefik:
    external: true